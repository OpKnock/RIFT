[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-engine"
version = "1.0.0"
license = "AGPL-3.0-or-later"
description = "Robust Intervention & Future Testing — counterfactual decision intelligence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
supabase = ["supabase>=2.0.0"]
qiskit = ["qiskit>=2.0.0", "qiskit-aer>=0.15", "qiskit-ibm-runtime>=0.30.0"]
physio = ["wfdb>=4.1"]

[project.scripts]
rift = "rift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
