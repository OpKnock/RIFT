<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RIFT Premium UI</title>
<meta http-equiv="refresh" content="0; url=./dashboard.html" />
<script src="./rift-live.js"></script>
<style>
body { background: #090d16; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; margin: 0; }
p { text-align: center; margin-top: 20vh; color: #94a3b8; font-size: 14px; }
a { color: #0891b2; }
</style>
</head>
<body>
<header class="sticky top-0 right-0 w-full z-40 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant">
<div class="flex justify-between items-center px-6 py-2.5 w-full">
<div class="flex items-center gap-6">
<span class="font-headline text-sm font-bold uppercase tracking-wider text-primary dark:text-primary">RIFT</span>
</div>
<div class="flex items-center gap-3">
<button class="px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-xs font-medium text-on-surface transition-colors active:opacity-80">
Verify Snapshot
</button>
<button class="px-3 py-1.5 rounded-lg bg-primary/10 text-primary border border-primary/20 hover:bg-primary/20 text-xs font-semibold transition-colors active:opacity-80">
Deploy Override
</button>
<div class="h-4 w-px bg-outline-variant mx-1"></div>
<div class="flex items-center gap-2">
<button class="p-1.5 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-xl">notifications_active</span>
</button>
<button class="p-1.5 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-xl">help_outline</span>
</button>
<button class="p-1.5 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-xl">tune</span>
</button>
</div>
</div>
</div>
</header>

<p>Opening RIFT dashboard... <a href="./dashboard.html">continue</a></p>
<script>window.location.replace("./dashboard.html");</script>
</body>
</html>
