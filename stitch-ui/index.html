<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RIFT Premium UI (Stitch) — index</title>
<script src="./rift-live.js"></script>
<style>
body { background: #020617; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; margin: 0; padding: 40px 24px; }
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { color: #94a3b8; font-size: 13px; }
ul { list-style: none; padding: 0; margin: 20px 0; display: grid; gap: 8px; }
a { display: block; background: #0b1220; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 16px; color: #e2e8f0; text-decoration: none; font-size: 14px; }
a:hover { border-color: #0891b2; }
a span { color: #0891b2; font-family: monospace; font-size: 12px; margin-right: 8px; }
#api-status { font-family: monospace; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">
<h1>RIFT Premium UI</h1>
<p>Screens built in Stitch, wired to the live RIFT engine API. Pick a screen:</p>
<div id="api-status">Checking API...</div>
<ul>
<li><a href="./dashboard.html"><span>01</span>Dashboard</a></li>
<li><a href="./scenarios.html"><span>02</span>Scenarios</a></li>
<li><a href="./simulation.html"><span>03</span>Simulation</a></li>
<li><a href="./runs.html"><span>04</span>Runs</a></li>
<li><a href="./experiments.html"><span>05</span>Experiments</a></li>
<li><a href="./evidence.html"><span>06</span>Evidence</a></li>
<li><a href="./incidents.html"><span>07</span>Incidents</a></li>
<li><a href="./explainability.html"><span>08</span>Explainability</a></li>
<li><a href="./settings.html"><span>09</span>Settings</a></li>
</ul>
</div>
<script>
(function () {
  RIFT.get("/api/health").then(function (h) {
    document.getElementById("api-status").textContent =
      "API " + RIFT.API + " — " + h.status + " · engine v" + (h.version || "?") + " · backend " + (h.quantum_backend || "?");
  }).catch(function (e) {
    document.getElementById("api-status").textContent =
      "API unreachable (" + (e.message || e.status || "error") + "). Start it: python -m rift.api";
  });
})();
</script>
</body>
</html>
