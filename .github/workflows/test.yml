name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate migrations are additive and idempotent
        run: python scripts/validate_migrations.py
      - name: Secret scan (fail on committed credentials)
        run: python scripts/secret_scan.py
      - name: Version consistency (pyproject, package, health)
        run: python scripts/check_versions.py
      - name: Phase completion matrix (statuses, evidence, tests)
        run: python scripts/check_phase_matrix.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Bandit SAST (fail on any finding)
        run: pip install -c constraints.txt "bandit>=1.9,<2" && bandit -r src -q
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build production image (repo-root context)
        run: docker build -f deployment/docker/Dockerfile -t rift:ci .
      - name: Smoke-test image health endpoint
        run: |
          docker run -d --name rift-ci -p 8080:8080 rift:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && break || sleep 5
          done
          curl -f http://localhost:8080/api/health
          docker stop rift-ci
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Ensure clean install (bust cache on code changes)
        run: rm -rf node_modules package-lock.json.bak 2>/dev/null; true
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npx vitest run
      - name: Typecheck + production build
        run: npm run build
      - name: Bundle-size gate (total JS ≤ 2048 KB uncompressed)
        run: |
          total=$(du -sb dist/assets/*.js | awk '{s+=$1} END {print s}')
          echo "total JS: $total bytes"
          test "$total" -le 2097152
