# Alertmanager Configuration for Local Development
# Phase 18: Monitoring/MLOps

global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@rift.local'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    - match:
        component: clinical
      receiver: 'clinical-alerts'
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: 'default'
    email_configs:
      - to: 'team@rift.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://rift-api:8080/webhooks/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@rift.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://rift-api:8080/webhooks/alerts/critical'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: 'team@rift.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://rift-api:8080/webhooks/alerts/warning'
        send_resolved: true

  - name: 'clinical-alerts'
    email_configs:
      - to: 'clinical-review@rift.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://rift-api:8080/webhooks/alerts/clinical'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']