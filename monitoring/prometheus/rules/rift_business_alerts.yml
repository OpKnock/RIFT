# RIFT Business & Product Alerting Rules
#
# CONTRACT: every rift_* metric referenced below MUST be exported by
# /metrics (see rift.health.monitoring.EXPORTED_METRICS / render_prometheus).
# Funnel/SLO metrics live in the future-alerts disabled file until a real
# exporter produces them.

groups:
  - name: rift.product
    interval: 15m
    rules:
      - alert: RiftAPILatencyDegraded
        expr: |
          max(rift_api_latency_p95_ms) > 1000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API P95 latency > 1s (15m window)"
          description: "Slowest route P95 {{ $value }}ms. User-facing latency degraded."

      - alert: RiftErrorRateElevated
        expr: |
          rift_failure_rate > 0.02
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API error rate > 2%"
          description: "{{ $value | humanizePercentage }} of requests failing. Check error logs."

      - alert: RiftPredictionsStalled
        expr: |
          rift_prediction_count > 0 and rate(rift_prediction_count[15m]) == 0
        for: 30m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "No new predictions in 15m despite prior traffic"
          description: "Prediction pipeline may be stalled. Check twin update path."
