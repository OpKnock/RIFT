# RIFT Health Alerting Rules
# Phase 18: Monitoring/MLOps - Production alerting for clinical twin.
#
# CONTRACT: every rift_* metric referenced below MUST be exported by
# /metrics (see rift.health.monitoring.EXPORTED_METRICS / render_prometheus).
# Aspirational metrics (twin gauges, drift scores, SLO budgets, per-endpoint
# histograms, billing funnels) live in the future-alerts disabled file until
# a real exporter produces them. Enforced by
# tests/test_internal_audit_regression.py::test_monitoring_contract.

groups:
  - name: rift.health.critical
    interval: 30s
    rules:
      - alert: RiftGuardianWithhold
        expr: |
          increase(rift_guardian_actions_total{action="withhold"}[5m]) > 0
        labels:
          severity: critical
          component: guardian
        annotations:
          summary: "Guardian WITHHOLD action triggered"
          description: "Guardian blocked a clinical display in the last 5m. Review immediately."
          runbook_url: "https://github.com/OpKnock/RIFT/docs/runbooks/guardian_withhold.md"

  - name: rift.health.warning
    interval: 60s
    rules:
      - alert: RiftGuardianWarn
        expr: |
          increase(rift_guardian_actions_total{action="warn"}[5m]) > 0
        labels:
          severity: warning
          component: guardian
        annotations:
          summary: "Guardian WARN action triggered"
          description: "Guardian flagged a concern in the last 5m. Review recommended."

      - alert: RiftGuardianRejectRateHigh
        expr: |
          rift_guardian_reject_rate > 0.5
        for: 5m
        labels:
          severity: warning
          component: guardian
        annotations:
          summary: "Guardian WITHHOLD rate above 50%"
          description: "Current withhold rate {{ $value | humanizePercentage }}. Predictions unreliable or inputs degraded."

      - alert: RiftMissingnessHigh
        expr: |
          rift_missingness_mean > 0.3
        for: 10m
        labels:
          severity: warning
          component: twin
        annotations:
          summary: "Mean input missingness above 30%"
          description: "Current {{ $value | humanizePercentage }}. Risk predictions degraded."

  - name: rift.infrastructure.critical
    interval: 30s
    rules:
      - alert: RiftAPIHighLatency
        expr: |
          max(rift_api_latency_p95_ms) > 2000
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API P95 latency > 2 seconds"
          description: "Slowest route P95 {{ $value }}ms. Clinical workflows may time out."

      - alert: RiftAPIHighErrorRate
        expr: |
          rift_failure_rate > 0.05
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 5xx failure rate > 5%"
          description: "Current {{ $value | humanizePercentage }}. Service degraded."
